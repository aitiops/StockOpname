<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Kasi</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <div class="bg-purple-600 text-white p-4 flex justify-between">

    <h1 class="font-bold text-xl">
      Dashboard Kasi
    </h1>

    <div>

      <span id="namaUser"></span>

      <button
        onclick="logout()"
        class="ml-4 bg-red-500 px-3 py-1 rounded-lg"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- CONTENT -->
  <div class="p-6">

    <!-- SUMMARY -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

      <div class="bg-white p-6 rounded-2xl shadow">

        <p class="text-gray-500">
          Total Halte
        </p>

        <h2
          id="totalHalte"
          class="text-3xl font-bold mt-2"
        >
          0
        </h2>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow">

        <p class="text-gray-500">
          Halte Selesai
        </p>

        <h2
          id="halteSelesai"
          class="text-3xl font-bold mt-2"
        >
          0
        </h2>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow">

        <p class="text-gray-500">
          On Service
        </p>

        <h2
          id="onService"
          class="text-3xl font-bold text-green-600 mt-2"
        >
          0
        </h2>

      </div>

      <div class="bg-white p-6 rounded-2xl shadow">

        <p class="text-gray-500">
          Out Service
        </p>

        <h2
          id="outService"
          class="text-3xl font-bold text-red-600 mt-2"
        >
          0
        </h2>

      </div>

    </div>


    <!-- PROGRESS -->
    <div class="bg-white p-6 rounded-2xl shadow mb-6">

      <div class="flex justify-between mb-2">

        <span class="font-bold">
          Progress Keseluruhan
        </span>

        <span id="progressText">
          0%
        </span>

      </div>

      <div class="w-full bg-gray-200 rounded-full h-5">

        <div
          id="progressBar"
          class="bg-purple-600 h-5 rounded-full"
          style="width:0%"
        ></div>

      </div>

    </div>


    <!-- KATEGORI -->
    <div class="bg-white p-6 rounded-2xl shadow mb-6">

      <h2 class="text-xl font-bold mb-4">
        Statistik Kategori
      </h2>

      <div
        id="kategoriContainer"
        class="grid grid-cols-1 md:grid-cols-3 gap-4"
      >

      </div>

    </div>


    <!-- KORIDOR -->
    <div class="bg-white p-6 rounded-2xl shadow">

      <h2 class="text-xl font-bold mb-4">
        Progress Per Koridor
      </h2>

      <div id="koridorContainer">

      </div>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
