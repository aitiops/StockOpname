<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Engineer - IT Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 min-h-screen">
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div> 
        <p id="loadingStatus" class="loading-text">Sinkronisasi Data...</p>
    </div>

    <nav class="bg-[#0095DA] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <p class="text-[10px] font-black opacity-80 uppercase tracking-widest">Engineer Panel</p>
                <h1 class="font-black text-lg">IT STOCK OPNAME</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="namaUser" class="text-xs font-bold bg-white/20 px-3 py-1.5 rounded-full"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 p-2 rounded-lg transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="p-4 md:p-6 container mx-auto max-w-5xl">
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="tj-card p-4 text-center bg-white shadow-sm">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Total</p>
                <p id="totalHalte" class="text-xl font-black text-slate-800">0</p>
            </div>
            <div class="tj-card p-4 text-center bg-white shadow-sm">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Done</p>
                <p id="halteSelesai" class="text-xl font-black text-green-600">0</p>
            </div>
            <div class="tj-card p-4 text-center bg-[#0095DA] border-none shadow-lg text-white">
                <p class="text-[9px] font-black opacity-70 uppercase mb-1">Progress</p>
                <p id="progressVisit" class="text-xl font-black">0%</p>
            </div>
        </div>

        <div class="mb-4 px-1">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-xs">
                    🔍
                </div>
                <input type="text" id="searchHalte" oninput="filterHalteManual()" placeholder="Cari nama atau ID halte..." class="w-full p-4 pl-12 rounded-2xl border-none shadow-xl focus:ring-2 focus:ring-[#0095DA] outline-none text-sm uppercase">
            </div>
        </div>

        <div id="dashboardKoridor" class="space-y-4"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    
    <script>
        // Logika UI Accordion Model Eksklusif (Klik satu, yang lain nutup)
        function toggleAccordion(id) {
            const all = document.querySelectorAll('.accordion-item');
            all.forEach(item => {
                if(item.id === id) {
                    item.classList.toggle('accordion-active');
                } else {
                    item.classList.remove('accordion-active');
                }
            });
        }
    </script>
</body>
</html>
