<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Reset - IT Stock Opname</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="tj-bg">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loader"></div> 
        <p id="loadingStatus" class="loading-text">Menyiapkan...</p>
    </div>
    
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔧</div>
            <h1 style="color: white; font-weight: 800; font-size: 0.9rem; text-transform: uppercase;">Update Sandi</h1>
        </div>

        <form onsubmit="event.preventDefault(); handleReset();">
            <div style="margin-bottom: 1rem;">
                <label class="label-text">Sandi Baru</label>
                <input type="password" id="newPassword" class="tj-input" placeholder="Min. 6 Karakter" required minlength="6">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="label-text">Ulangi Sandi</label>
                <input type="password" id="confirmPassword" class="tj-input" placeholder="Konfirmasi" required>
                <label class="checkbox-container">
                    <input type="checkbox" id="showReset" onclick="toggleReset()">
                    <span>Lihat Sandi</span>
                </label>
            </div>
            <button type="submit" id="btnReset" class="tj-btn">Simpan</button>
        </form>
        <p id="msg" style="text-align: center; color: #fbbf24; font-size: 0.65rem; font-weight: 700; margin-top: 1rem;"></p>
    </div>

    <script>
        function toggleReset() {
            const p1 = document.getElementById("newPassword");
            const p2 = document.getElementById("confirmPassword");
            const type = p1.type === "password" ? "text" : "password";
            p1.type = type; p2.type = type;
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
