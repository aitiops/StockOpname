<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Buat Password Baru</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">Demi keamanan, silakan ganti password default Anda.</p>

    <form onsubmit="event.preventDefault(); handleReset();">
      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">Password Baru</label>
        <input type="password" id="newPassword" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" required minlength="6">
      </div>
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium">Konfirmasi Password Baru</label>
        <input type="password" id="confirmPassword" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" required>
      </div>

      <button type="submit" id="btnReset" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold transition shadow-md">
        Simpan Password
      </button>
    </form>
    
    <p id="msg" class="text-center mt-4 text-sm font-medium"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
