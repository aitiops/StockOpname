<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Sandi - IT Stock Opname</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tj-bg">

    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔧</div>
            <h1 style="color: white; font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">
                Ganti Sandi Baru
            </h1>
            <p style="color: rgba(255,255,255,0.7); font-size: 0.65rem; margin-top: 0.3rem; padding: 0 10px;">
                Demi keamanan akun, silakan perbarui sandi default Anda.
            </p>
        </div>

        <form onsubmit="event.preventDefault(); handleReset();">
            <div style="margin-bottom: 1rem;">
                <label class="label-text">Sandi Baru</label>
                <input type="password" id="newPassword" class="tj-input" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="label-text">Konfirmasi Sandi Baru</label>
                <input type="password" id="confirmPassword" class="tj-input" placeholder="Ulangi sandi baru" required>
                
                <label class="checkbox-container">
                    <input type="checkbox" id="showReset" onclick="toggleReset()">
                    <span>Lihat Sandi</span>
                </label>
            </div>

            <button type="submit" id="btnReset" class="tj-btn">Simpan Sandi</button>
        </form>

        <p id="msg" style="text-align: center; color: #fbbf24; font-size: 0.7rem; font-weight: 700; margin-top: 1.2rem; line-height: 1.4;"></p>
    </div>

    <script>
        // Fungsi sederhana untuk intip sandi
        function toggleReset() {
            const p1 = document.getElementById("newPassword");
            const p2 = document.getElementById("confirmPassword");
            const type = p1.type === "password" ? "text" : "password";
            p1.type = type; 
            p2.type = type;
        }
    </script>

    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
