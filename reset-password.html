<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Buat Password Baru</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">Demi keamanan, silakan ganti password default Anda.</p>

    <form onsubmit="event.preventDefault(); handleReset();">
      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">Password Baru</label>
        <input type="password" id="newPassword" class="w-full border rounded-lg p-3" required minlength="6">
      </div>
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium">Konfirmasi Password</label>
        <input type="password" id="confirmPassword" class="w-full border rounded-lg p-3" required>
      </div>

      <button type="submit" id="btnReset" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">
        Simpan Password
      </button>
    </form>
    <p id="msg" class="text-center mt-4 text-sm"></p>
  </div>

  <script src="js/config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("user_id");

    async function handleReset() {
      const pass = document.getElementById("newPassword").value;
      const conf = document.getElementById("confirmPassword").value;
      const btn = document.getElementById("btnReset");

      if (pass !== conf) {
        alert("Password tidak cocok!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "resetPassword",
            user_id: userId,
            new_password: pass
          })
        });
        const data = await res.json();
        if (data.status) {
          alert(data.message);
          window.location.href = "index.html"; // Balik ke login
        } else {
          alert(data.message);
        }
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan Password";
      }
    }
  </script>
</body>
</html>
