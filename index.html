<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - IT Stock Opname</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="tj-bg">

    <div class="glass-card flex flex-col items-center">
        
        <div class="w-full flex flex-col items-center text-center mb-[1.5rem]">
            <img src="assets/logo_tj.png" alt="Logo TJ" style="height: 45px; margin-bottom: 0.5rem;">
            <h1 style="color: white; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;">IT Stock Opname</h1>
        </div>

        <form onsubmit="event.preventDefault(); login();" class="w-full">
            <div style="margin-bottom: 1rem;">
                <label class="label-text">Username / NIK</label>
                <input type="text" id="username" class="tj-input" placeholder="NIK Anda" required>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="label-text">Kata Sandi</label>
                <input type="password" id="password" class="tj-input" placeholder="Password" required>
                <label class="checkbox-container select-none">
                    <input type="checkbox" id="showPass" onclick="togglePass('password')">
                    <span>Tampilkan Sandi</span>
                </label>
            </div>
            
            <button type="submit" class="tj-btn">Masuk System</button>
        </form>
        
        <p id="message" style="text-align: center; color: #fbbf24; font-size: 0.65rem; font-weight: 700; margin-top: 1rem;"></p>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div>
        <div class="loading-text">Memverifikasi...</div>
    </div>

    <script>
        function togglePass(id) {
            const x = document.getElementById(id);
            if (x) x.type = x.type === "password" ? "text" : "password";
        }

        function showLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('loading-active');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.remove('loading-active');
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
