<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Stock Opname</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="tj-bg">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="assets/logo_tj.png" 
                 alt="Logo TJ" style="height: 45px; margin-bottom: 0.5rem;">
            <h1 style="color: white; font-weight: 800; font-size: 0.9rem; text-transform: uppercase;">IT Stock Opname</h1>
        </div>

        <form onsubmit="event.preventDefault(); login();">
            <div style="margin-bottom: 1rem;">
                <label class="label-text">Username / NIK</label>
                <input type="text" id="username" class="tj-input" placeholder="NIK Anda" required>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="label-text">Kata Sandi</label>
                <input type="password" id="password" class="tj-input" placeholder="••••••••" required>
                <label class="checkbox-container">
                    <input type="checkbox" id="showPass" onclick="togglePass('password')">
                    <span>Tampilkan Sandi</span>
                </label>
            </div>
            <button type="submit" class="tj-btn">Masuk</button>
        </form>
        <p id="message" style="text-align: center; color: #fbbf24; font-size: 0.65rem; font-weight: 700; margin-top: 1rem;"></p>
    </div>

    <script>
        function togglePass(id) {
            const x = document.getElementById(id);
            x.type = x.type === "password" ? "text" : "password";
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
