<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Halte</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <div class="bg-blue-600 text-white p-4 flex justify-between">

    <h1 class="font-bold">
      Detail Halte
    </h1>

    <button
      onclick="window.location.href='engineer.html'"
      class="bg-white text-blue-600 px-3 py-1 rounded"
    >
      Kembali
    </button>

  </div>

  <div class="p-6">

    <!-- INFO -->
    <div class="bg-white p-6 rounded-2xl shadow mb-6">

      <h2
        id="halteTitle"
        class="text-2xl font-bold"
      >
      </h2>

      <p
        id="koridorTitle"
        class="text-gray-500"
      >
      </p>

    </div>


    <!-- BUTTON -->
    <div class="mb-4">

      <button
        onclick="goInput()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg"
      >

        + Tambah Perangkat

      </button>

    </div>


    <!-- TABLE -->
    <!-- SUMMARY -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

  <div class="bg-white p-4 rounded-2xl shadow">

    <p class="text-gray-500">
      Total Perangkat
    </p>

    <p
      id="totalPerangkat"
      class="text-3xl font-bold"
    >
      0
    </p>

  </div>

  <div class="bg-white p-4 rounded-2xl shadow">

    <p class="text-gray-500">
      On Service
    </p>

    <p
      id="totalOn"
      class="text-3xl font-bold text-green-600"
    >
      0
    </p>

  </div>

  <div class="bg-white p-4 rounded-2xl shadow">

    <p class="text-gray-500">
      Out of Service
    </p>

    <p
      id="totalOff"
      class="text-3xl font-bold text-red-600"
    >
      0
    </p>

  </div>

</div>


<!-- LIST DEVICE -->
<div
  id="tablePerangkat"
  class="
    grid
    grid-cols-1
    md:grid-cols-2
    xl:grid-cols-3
    gap-4
  "
>

</div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/halte-detail.js"></script>

</body>
</html>
