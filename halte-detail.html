<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Halte</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <div class="bg-blue-600 text-white p-4 flex justify-between">

    <h1 class="font-bold">
      Detail Halte
    </h1>

    <button
      onclick="window.location.href='engineer.html'"
      class="bg-white text-blue-600 px-3 py-1 rounded"
    >
      Kembali
    </button>

  </div>

  <div class="p-6">

    <!-- INFO -->
    <div class="bg-white p-6 rounded-2xl shadow mb-6">

      <h2
        id="halteTitle"
        class="text-2xl font-bold"
      >
      </h2>

      <p
        id="koridorTitle"
        class="text-gray-500"
      >
      </p>

    </div>


    <!-- BUTTON -->
    <div class="mb-4">

      <button
        onclick="goInput()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg"
      >

        + Tambah Perangkat

      </button>

    </div>


    <!-- TABLE -->
    <div class="bg-white p-6 rounded-2xl shadow overflow-auto">

      <table class="w-full">

        <thead>

          <tr class="border-b">

            <th class="text-left p-2">Photo</th>
            <th class="text-left p-2">Kategori</th>
            <th class="text-left p-2">Perangkat</th>
            <th class="text-left p-2">Merk/Model</th>
            <th class="text-left p-2">SN</th>
            <th class="text-left p-2">Status</th>
            <th class="text-left p-2">Engineer</th>
            <th class="text-left p-2">Action</th>

          </tr>

        </thead>

        <tbody id="tablePerangkat">

        </tbody>

      </table>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/halte-detail.js"></script>

</body>
</html>
