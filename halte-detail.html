<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Halte</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
    <h1 class="font-bold text-lg">Detail Halte</h1>
    <button onclick="window.location.href='engineer.html'" class="bg-white text-blue-600 px-4 py-1 rounded-lg font-medium hover:bg-gray-100 transition">
      Kembali
    </button>
  </div>

  <div class="p-6">
    <!-- INFO -->
    <div class="bg-white p-6 rounded-2xl shadow mb-6 border-l-4 border-blue-600">
      <h2 id="halteTitle" class="text-2xl font-bold text-gray-800"></h2>
      <p id="koridorTitle" class="text-gray-500 font-medium"></p>
    </div>

    <!-- ACTION BUTTON -->
    <div class="mb-6">
      <button onclick="goInput()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition w-full md:w-auto">
        + Tambah Perangkat
      </button>
    </div>

    <!-- FILTER -->
    <div class="grid md:grid-cols-2 gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Cari serial number / perangkat..." onkeyup="filterPerangkat()" class="border p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
      <select id="filterStatus" onchange="filterPerangkat()" class="border p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
        <option value="">Semua Status</option>
        <option value="On Service">On Service</option>
        <option value="Out of Service">Out of Service</option>
      </select>
    </div>

    <!-- SUMMARY -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl shadow border-b-4 border-blue-500">
        <p class="text-gray-500 text-sm font-bold uppercase tracking-wider">Total Perangkat</p>
        <p id="totalPerangkat" class="text-3xl font-black text-gray-800">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow border-b-4 border-green-500">
        <p class="text-gray-500 text-sm font-bold uppercase tracking-wider">On Service</p>
        <p id="totalOn" class="text-3xl font-black text-green-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow border-b-4 border-red-500">
        <p class="text-gray-500 text-sm font-bold uppercase tracking-wider">Out of Service</p>
        <p id="totalOff" class="text-3xl font-black text-red-600">0</p>
      </div>
    </div>

    <!-- LIST DEVICE -->
    <div id="tablePerangkat" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <!-- Data dirender oleh JS -->
    </div>
  </div>

  <!-- PHOTO MODAL -->
  <div id="photoModal" onclick="closePhoto()" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
    <button onclick="closePhoto()" class="absolute top-4 right-4 text-white text-5xl font-light hover:text-gray-300 transition">&times;</button>
    <img id="modalImage" onclick="event.stopPropagation()" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl border-4 border-white/10">
  </div>
  
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/halte-detail.js"></script>
</body>
</html>
