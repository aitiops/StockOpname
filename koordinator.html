<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Koordinator - IT Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div> 
        <p id="loadingStatus" class="loading-text">Menyusun Laporan...</p>
    </div>

    <nav class="bg-[#0095DA] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-black text-lg tracking-tight uppercase">Monitoring Koordinator</h1>
            <div class="flex items-center gap-3">
                <span id="namaUser" class="text-[10px] font-bold bg-white/20 px-3 py-1 rounded-full border border-white/30 uppercase tracking-widest"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 p-2 rounded-xl transition shadow-lg active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="p-4 md:p-8 container mx-auto max-w-6xl">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="label-text mb-1 text-slate-400">Total Halte</p>
                <h2 id="totalHalte" class="text-3xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="label-text mb-1 text-green-600">Selesai</p>
                <h2 id="halteSelesai" class="text-3xl font-black text-green-600">0</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="label-text mb-1 text-[#0095DA]">Progress</p>
                <h2 id="progressVisit" class="text-3xl font-black text-[#0095DA]">0%</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="label-text mb-1 text-amber-500">Total Alat</p>
                <h2 id="totalPerangkat" class="text-3xl font-black text-amber-500">0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <section>
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest">Performance Engineer</h2>
                    <span class="text-[10px] font-bold text-slate-400">Monitoring Lapangan</span>
                </div>
                <div id="engineerList" class="space-y-4">
                    </div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest">Progress Wilayah</h2>
                    <span class="text-[10px] font-bold text-slate-400">Status Koridor</span>
                </div>
                <div id="koridorList" class="space-y-4">
                    </div>
            </section>

        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/koordinator.js"></script>
</body>
</html>
