<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Stock Opname - IT Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div> 
        <p id="loadingStatus" class="loading-text">Menyiapkan Formulir</p>
    </div>

    <nav class="bg-[#0095DA] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.history.back()" class="hover:bg-white/20 p-2 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <h1 id="pageTitle" class="font-black text-lg tracking-tight uppercase">Input Opname</h1>
            </div>
        </div>
    </nav>

    <main class="p-4 md:p-8 container mx-auto max-w-2xl">
        
        <div class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-[#0095DA] mb-8">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="label-text mb-1">Koridor</p>
                    <p id="infoKoridor" class="font-bold text-slate-700">-</p>
                </div>
                <div>
                    <p class="label-text mb-1">Halte</p>
                    <p id="infoHalte" class="font-bold text-slate-700">-</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="space-y-6">
                <div>
                    <label class="label-text">Kategori Perangkat</label>
                    <select id="kategori" onchange="changeKategori()" class="tj-input">
                        <option value="">Pilih Kategori</option>
                    </select>
                </div>

                <div>
                    <label class="label-text">Nama Perangkat</label>
                    <select id="namaPerangkat" onchange="changePerangkat()" class="tj-input">
                        <option value="">Pilih Perangkat</option>
                    </select>
                </div>

                <div>
                    <label class="label-text">Merk / Model</label>
                    <select id="merkModel" class="tj-input">
                        <option value="">Pilih Merk / Model</option>
                    </select>
                </div>

                <div id="arahContainer" class="hidden">
                    <label class="label-text">Arah Perangkat</label>
                    <select id="arahPerangkat" class="tj-input bg-blue-50/50">
                        <option value="">Pilih Arah</option>
                    </select>
                </div>

                <div>
                    <label class="label-text">Serial Number (S/N)</label>
                    <input type="text" id="serialNumber" placeholder="Masukkan S/N Perangkat" class="tj-input">
                </div>

                <div>
                    <label class="label-text">Status Perangkat</label>
                    <select id="statusPerangkat" class="tj-input">
                        <option value="" selected disabled>-- Pilih Status Perangkat --</option>
                        <option value="On Service">On Service</option>
                        <option value="Out of Service">Out of Service</option>
                    </select>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="label-text">Dokumentasi Foto</label>
                    <div class="mt-2 flex flex-col items-center p-8 border-2 border-dashed border-slate-200 rounded-3xl hover:border-[#0095DA] transition-all cursor-pointer bg-slate-50/50" onclick="document.getElementById('photo').click()">
                        <input type="file" id="photo" accept="image/*" capture="environment" onchange="previewImage(event)" class="hidden">
                        <div id="uploadPlaceholder" class="text-center">
                            <span class="text-3xl mb-2 block">📷</span>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Ambil Foto Perangkat</p>
                        </div>
                        <img id="previewPhoto" class="hidden w-full max-w-[200px] rounded-2xl shadow-xl">
                    </div>
                </div>

                <div class="pt-6">
                    <button id="btnSave" onclick="saveStockOpname()" class="w-full bg-[#0095DA] text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-blue-200 active:scale-95 transition-all">
                        Simpan Data
                    </button>
                    <p id="message" class="text-center mt-4 text-[10px] font-black uppercase tracking-widest"></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stock-opname.js"></script>
</body>
</html>
