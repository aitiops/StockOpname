<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Input Stock Opname</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <div class="bg-blue-600 text-white p-4 flex justify-between">

    <h1 class="font-bold">
      Input Stock Opname
    </h1>

    <button
      onclick="window.location.href='engineer.html'"
      class="bg-white text-blue-600 px-3 py-1 rounded"
    >
      Kembali
    </button>

  </div>

  <!-- INFO HALTE -->

  <div class="bg-white p-4 rounded-lg mb-4 shadow">
  
    <p class="text-sm text-gray-500">
      Koridor
    </p>
  
    <h2
      id="infoKoridor"
      class="font-bold text-lg"
    >
      -
    </h2>
  
  
    <p class="text-sm text-gray-500 mt-3">
      Halte
    </p>
  
    <h2
      id="infoHalte"
      class="font-bold text-lg"
    >
      -
    </h2>
  
  </div>
  
  
  <!-- ARAH -->
  
  <div
    id="arahContainer"
    class="mb-4 hidden"
  >
  
    <label class="block mb-2">
      Arah
    </label>
  
    <select
      id="arahPerangkat"
      class="w-full border p-3 rounded-lg"
    >
  
      <option value="">
        Pilih Arah
      </option>
  
    </select>
  
  </div>
  <!-- CONTENT -->
  <div class="mb-4">

  <label class="block mb-2">
    Kategori
  </label>

  <select
    id="kategori"
    onchange="changeKategori()"
    class="w-full border p-3 rounded-lg"
  >

    <option value="">
      Silahkan Pilih Kategori
    </option>

  </select>

</div>


<div class="mb-4">

  <label class="block mb-2">
    Nama Perangkat
  </label>

  <select
    id="namaPerangkat"
    onchange="changePerangkat()"
    class="w-full border p-3 rounded-lg"
  >

    <option value="">
      Silahkan Pilih Perangkat
    </option>

  </select>

</div>


<div class="mb-4">

  <label class="block mb-2">
    Merk / Model
  </label>

  <select
    id="merkModel"
    class="w-full border p-3 rounded-lg"
  >

    <option value="">
      Silahkan Pilih Merk / Model
    </option>

  </select>

</div>


<div class="mb-4">

  <label class="block mb-2">
    Serial Number
  </label>

  <input
    type="text"
    id="serialNumber"
    class="w-full border p-3 rounded-lg"
  >

</div>


<div class="mb-4">

  <label class="block mb-2">
    Status
  </label>

  <select
    id="statusPerangkat"
    class="w-full border p-3 rounded-lg"
  >

    <option value="On Service">
      On Service
    </option>

    <option value="Out of Service">
      Out of Service
    </option>

  </select>

</div>


<div class="mb-4">

  <label class="block mb-2">
    Photo Perangkat
  </label>

  <input
    type="file"
    id="photo"
    accept="image/*"
    class="w-full border p-3 rounded-lg"
  >

</div>

      <button
        onclick="saveStockOpname()"
        class="bg-blue-600 text-white px-6 py-3 rounded-lg"
      >
        Simpan
      </button>

      <p
        id="message"
        class="mt-4 text-green-600"
      ></p>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stock-opname.js"></script>

</body>
</html>
